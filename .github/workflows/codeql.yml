  push:
    # branches: [ "master", "main", "develop", "release/*" ]
  pull_request:
    branches: [ "master", "main", "develop", "release/*" ]
  schedule:
    - cron: '30 19 * * 0'

jobs:
  codeql-scan:
    uses: iZettle/.github/.github/workflows/codeql-mobile-sm.yml@main
